name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxuosa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luxuosa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JWT_SECRET: ci-jwt-secret-luxuosa
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxuosa
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxuosa
      NFCE_MOCK: "true"
      NFCE_PROCESS_IN_API: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend + backend
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Prisma generate + migrate
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Check (build FE + routes + unit + integration)
        run: npm run check
